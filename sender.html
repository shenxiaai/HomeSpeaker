<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HomeSpeaker Sender</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    font-family:Arial;
    background:#f4f4f4;
    margin:30px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

textarea{
    width:100%;
    height:150px;
    font-size:16px;
    padding:10px;
    box-sizing:border-box;
}

input[type="datetime-local"]{
    width:100%;
    height:45px;
    margin-top:10px;
    padding:0 10px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    margin-top:15px;
    width:100%;
    height:50px;
    font-size:16px;
    cursor:pointer;
}

#status{
    margin-top:20px;
    color:green;
}

.item{
    padding:10px;
    margin-top:10px;
    border:1px solid #ddd;
    cursor:pointer;
}

#quickButtons{
    margin-top:20px;
}

.quick{
    width:auto;
    padding:10px 18px;
    margin:5px;
    font-size:14px;
}

.schedule-section{
    margin-top:25px;
    padding-top:5px;
    border-top:1px solid #ddd;
}
</style>
</head>

<body>

  <div class="container">

    <h2>家庭广播</h2>

    <textarea id="text"></textarea>

    <button onclick="send()">立即发送</button>

    <div class="schedule-section">
      <h3>一次性定时播报</h3>
      <input type="datetime-local" id="scheduleTime">
      <button onclick="sendScheduled()">定时发送</button>
    </div>

    <div id="status"></div>

    <h3>常用语</h3>

    <div id="quickButtons">
      <button class="quick" onclick="quickSend('糖糖糖，头抬高一点')">糖糖糖，头抬高一点</button>
      <button class="quick" onclick="quickSend('糖糖糖，背要挺直')">糖糖糖，背要挺直</button>
      <button class="quick" onclick="quickSend('糖糖糖，设倒计时')">糖糖糖，设倒计时</button>
      <button class="quick" onclick="quickSend('糖糖糖，年轮app要复习了')">糖糖糖，年轮app要复习了</button>
      <button class="quick" onclick="quickSend('开始学习')">开始学习</button>
      <button class="quick" onclick="quickSend('奖励一个积分')">奖励一个积分</button>
      <button class="quick" onclick="quickSend('眼睛休息5分钟')">眼睛休息5分钟</button>
    </div>

  </div>

<script>

const SUPABASE_URL="https://tkpwdoenhvzkxrwwomvn.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRrcHdkb2VuaHZ6a3hyd3dvbXZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4MjY1ODksImV4cCI6MjA5ODQwMjU4OX0.gh7Ponb6vb4M3r9RMFlaevyGnzjfVZOmpVhxrsyWrPw";

const client=supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

async function send(){
    const text=document.getElementById("text").value.trim();
    if(text===""){
        alert("请输入内容");
        return;
    }

    document.getElementById("status").innerHTML="发送中...";

    const { error } = await client
    .from("messages")
    .insert([
      {
        content: text
      }
    ]);

    if(error){
        document.getElementById("status").innerHTML=
        "发送失败："+error.message;
        return;
    }

    document.getElementById("status").innerHTML="发送成功";

    document.getElementById("text").value="";
}

async function sendScheduled(){
    const text=document.getElementById("text").value.trim();
    const timeValue=document.getElementById("scheduleTime").value;

    if(text===""){
        alert("请输入内容");
        return;
    }

    if(!timeValue){
        alert("请选择播报时间");
        return;
    }

    // datetime-local 表示发送设备的本地时间；转成 ISO 后由 Supabase 保存。
    const scheduledTime=new Date(timeValue);

    if(Number.isNaN(scheduledTime.getTime())){
        alert("播报时间无效");
        return;
    }

    if(scheduledTime<=new Date()){
        alert("播报时间必须晚于当前时间");
        return;
    }

    document.getElementById("status").innerHTML="正在设置定时播报...";

    const { error } = await client
    .from("messages")
    .insert([
      {
        content:text,
        scheduled_at:scheduledTime.toISOString()
      }
    ]);

    if(error){
        document.getElementById("status").innerHTML=
        "设置失败："+error.message;
        return;
    }

    document.getElementById("status").innerHTML=
    "定时播报设置成功："+scheduledTime.toLocaleString();

    document.getElementById("text").value="";
    document.getElementById("scheduleTime").value="";
}

async function quickSend(text){
    document.getElementById("text").value = text;
    await send();
}

document.getElementById("text").addEventListener("keydown",e=>{
    if(e.ctrlKey&&e.key==="Enter"){
        send();
    }
});

</script>

</body>
</html>
